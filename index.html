<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#082f5b" />
  <meta name="description" content="Samar State University Thesis Management and Institutional Research Repository" />
  <title>SSU Institutional Research Repository</title>
  <link rel="icon" href="/assets/ssu-logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css" />
  <style>
    #boot-fallback{min-height:100vh;display:grid;place-items:center;background:#fff;color:#082f5b;font:700 14px "Source Sans 3",system-ui,sans-serif}
    #boot-fallback div{text-align:center}.boot-dot{width:34px;height:34px;margin:0 auto 12px;border:3px solid #dce7f0;border-top-color:#d5a92f;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="app" aria-live="polite">
    <div id="boot-fallback"><div><div class="boot-dot"></div>Loading SSU Institutional Repository…</div></div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
